defaults:
  $metadata:
    tenant: ""
  namespace: "{{$metadata.tenant}}"

projectDefaults:
  name: "{{$metadata.tenant}}-{{$id}}"
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  sourceRepos:
    - "*"
  description: "Project owned by tenant \"{{$metadata.tenant}}\""
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
  rolesObject:
    read-apps:
      $enabled: false
      description: Read-apps privileges for {{.name}}
      policies:
        - p, proj:{{.name}}:read-apps, applications, get, {{.name}}/*, allow
        - p, proj:{{.name}}:read-apps, applicationsets, get, {{.name}}/*, allow
      groups: []
    read-all:
      $enabled: false
      description: Read-all privileges for {{.name}}
      policies:
        - p, proj:{{.name}}:read-all, *, get, {{.name}}/*, allow
      groups: []
    admin:
      $enabled: false
      description: Admin privileges for {{.name}}
      policies:
        - p, proj:{{.name}}:admin, *, *, {{.name}}/*, allow
      groups: []

projects:
  main:
    name: "{{$metadata.tenant}}"
    sourceNamespaces:
      - "{{$metadata.tenant}}"
    destinations:
      - name: in-cluster
      - namespace: "{{$metadata.tenant}}"
        name: in-cluster
      - namespace: "{{$metadata.tenant}}-*"
        name: in-cluster

namespaceDefaults:
  name: "{{$metadata.tenant}}-{{$id}}"
  annotations:
    argocd.argoproj.io/sync-options: Delete=confirm,Prune=confirm

  resources:
    networkPolicies:
      default-deny-all:
        $enabled: false
        podSelector: {}
        policyTypes:
          - Ingress
          - Egress
      default-allow-all:
        podSelector: {}
        ingress:
          - {}
        egress:
          - {}
        policyTypes:
          - Ingress
          - Egress
      default-allow-dns:
        $enabled: false
        podSelector: {}
        policyTypes:
          - Egress
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53

    resourceQuotas:
      compute-resources:
        $enabled: false
        hard:
          requests.cpu: "1"
          requests.memory: "1Gi"
          limits.cpu: "2"
          limits.memory: "2Gi"
      object-counts:
        $enabled: false
        hard:
          configmaps: "10"
          persistentvolumeclaims: "4"
          pods: "4"
          replicationcontrollers: "20"
          secrets: "10"
          services: "10"
          services.loadbalancers: "2"

    limitRanges:
      compute-resources:
        $enabled: false
        limits:
        - defaultRequest:
            cpu: 100m
            memory: 100Mi
          default:
            cpu: 100m
            memory: 100Mi
          type: Container

namespaces:
  main:
    name: "{{$metadata.tenant}}"

applicationDefaults:
  project: "{{$metadata.tenant}}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  destination:
    name: in-cluster
    namespace: "{{$metadata.tenant}}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  sourcesObject:
    main:
      helm:
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/{{$id}}/values.yaml
          - $values/{{$id}}/values-type-{{$metadata.clusterType}}.yaml
          - $values/{{$id}}/values-{{$metadata.clusterId}}.yaml
    extras:
      $enabled: false
      repoURL: git@github.com:tombulled/k8s.git
      path: charts/extras
      targetRevision: main
      helm:
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/{{$id}}/values.yaml
          - $values/{{$id}}/values-type-{{$metadata.clusterType}}.yaml
          - $values/{{$id}}/values-{{$metadata.clusterId}}.yaml
    values:
      repoURL: git@github.com:tombulled/values.git
      targetRevision: main

xApplicationSetDefaults:
  template:
    spec:
      project: "{{$metadata.tenant}}"
  syncPolicy:
    preserveResourcesOnDeletion: false
  generatorsObject:
    main:
      x-git:
        repoURL: git@github.com:tombulled/k8s.git
        revision: HEAD
        directories:
          - path: "apps/{{$metadata.tenant}}/{{$id}}/*"
        valueFiles:
          - values.yaml
          - values-type-{{$metadata.clusterType}}.yaml
          - values-{{$metadata.clusterId}}.yaml
  defaults:
    name: "{{$id}}-{{ `{{$id}}` }}"
    sourcesObject:
      main:
        helm:
          valueFiles:
            - $values/{{$id}}/values.yaml
            - $values/{{$id}}/values-type-{{$metadata.clusterType}}.yaml
            - $values/{{$id}}/values-{{$metadata.clusterId}}.yaml
            - $values/{{$id}}/{{ `{{$id}}` }}/values.yaml
            - $values/{{$id}}/{{ `{{$id}}` }}/values-type-{{$metadata.clusterType}}.yaml
            - $values/{{$id}}/{{ `{{$id}}` }}/values-{{$metadata.clusterId}}.yaml
      extras:
        helm:
          valueFiles:
            - $values/{{$id}}/values.yaml
            - $values/{{$id}}/values-type-{{$metadata.clusterType}}.yaml
            - $values/{{$id}}/values-{{$metadata.clusterId}}.yaml
            - $values/{{$id}}/{{ `{{$id}}` }}/values.yaml
            - $values/{{$id}}/{{ `{{$id}}` }}/values-type-{{$metadata.clusterType}}.yaml
            - $values/{{$id}}/{{ `{{$id}}` }}/values-{{$metadata.clusterId}}.yaml

xApplicationSets:
  main:
    name: "{{$metadata.tenant}}"
    generatorsObject:
      main:
        x-git:
          directories:
            - path: "apps/{{$metadata.tenant}}/*"
    defaults:
      name: "{{ `{{$id}}` }}"
      sourcesObject:
        main:
          helm:
            valueFiles:
              - $values/{{$id}}/values.yaml
              - $values/{{$id}}/values-type-{{$metadata.clusterType}}.yaml
              - $values/{{$id}}/values-{{$metadata.clusterId}}.yaml
        extras:
          helm:
            valueFiles:
              - $values/{{$id}}/values.yaml
              - $values/{{$id}}/values-type-{{$metadata.clusterType}}.yaml
              - $values/{{$id}}/values-{{$metadata.clusterId}}.yaml
