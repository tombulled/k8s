enabled: true

defaults:
  namespace: argocd

projectDefaults:
  name: ~

namespaceDefaults:
  name: ~

projects:
  main:
    destinationsObject:
      all:
        namespace: "*"
        name: in-cluster
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"

namespaces:
  main: ~
  argocd: {}
  cert-manager: {}
  ingress-nginx: {}
  monitoring: {}
  openebs: {}
  sealed-secrets: {}
  traefik: {}

applicationDefaults:
  destination:
    namespace: "{{.id}}"

networkPolicyDefaults:
  enabled: false
resourceQuotaDefaults:
  enabled: false
limitRangeDefaults:
  enabled: false
