$enabled: true

defaults:
  namespace: argocd

projectDefaults:
  name: "{{$id}}"

namespaceDefaults:
  name: "{{$id}}"

projects:
  main:
    destinationsObject:
      all:
        namespace: "*"
        name: in-cluster
    clusterResourceWhitelistObject:
      all:
        $enabled: true

namespaces:
  main: ~
  argocd:
    annotations:
      argocd.argoproj.io/sync-options: Delete=false,Prune=false
  cert-manager: {}
  ingress-nginx: {}
  monitoring: {}
  openebs: {}
  sealed-secrets: {}
  traefik: {}

applicationDefaults:
  destination:
    namespace: "{{$id}}"

networkPolicyDefaults:
  $enabled: false
resourceQuotaDefaults:
  $enabled: false
limitRangeDefaults:
  $enabled: false
