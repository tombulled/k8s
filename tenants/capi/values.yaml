appProjects:
  main:
    clusterResourceWhitelist:
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
    destinationsObject:
      ironic: {}
      capm3-system: {}
      metal3-ipam-system: {}
      baremetal-operator-system: {}

namespaceDefaults:
  name: ~

namespaces:
  # ironic-standalone-operator-system: {}
  ironic: {}
  capi-operator-system: {} # cluster-api-operator
  capi-system: {} # cluster-api core provider
  capi-kubeadm-bootstrap-system: {} # cluster-api kubeadm bootstrap provider
  capi-kubeadm-control-plane-system: {} # cluster-api kubeadm control-plane provider
  capm3-system: {} # cluster-api metal3 infrastructure provider
  metal3-ipam-system: {} # cluster-api metal3 ipam provider
  baremetal-operator-system: {} # metal3 BMO (kustomize)
