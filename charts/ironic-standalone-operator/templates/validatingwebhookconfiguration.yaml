apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "ironic-standalone-operator.fullname" . }}-serving-cert
  labels:
    {{- include "ironic-standalone-operator.labels" . | nindent 4 }}
    # app.kubernetes.io/component: webhook
    # app.kubernetes.io/created-by: ironic-standalone-operator
    # app.kubernetes.io/instance: validating-webhook-configuration
    # app.kubernetes.io/managed-by: kustomize
    # app.kubernetes.io/name: validatingwebhookconfiguration
    # app.kubernetes.io/part-of: ironic-standalone-operator
  name: {{ include "ironic-standalone-operator.fullname" . }}-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "ironic-standalone-operator.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-ironic-metal3-io-v1alpha1-ironic
  failurePolicy: Fail
  name: validate-ironic.ironic.metal3.io
  rules:
  - apiGroups:
    - ironic.metal3.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - ironics
  sideEffects: None
