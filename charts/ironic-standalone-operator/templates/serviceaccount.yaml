{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ironic-standalone-operator.serviceAccountName" . }}-controller-manager
  labels:
    {{- include "ironic-standalone-operator.labels" . | nindent 4 }}
    # app.kubernetes.io/component: rbac
    # app.kubernetes.io/created-by: ironic-standalone-operator
    # app.kubernetes.io/instance: controller-manager
    # app.kubernetes.io/managed-by: kustomize
    # app.kubernetes.io/name: serviceaccount
    # app.kubernetes.io/part-of: ironic-standalone-operator
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
