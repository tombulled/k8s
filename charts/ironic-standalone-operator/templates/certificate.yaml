apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "ironic-standalone-operator.fullname" . }}-serving-cert
  labels:
    {{- include "ironic-standalone-operator.labels" . | nindent 4 }}
    # app.kubernetes.io/component: certificate
    # app.kubernetes.io/created-by: ironic-standalone-operator
    # app.kubernetes.io/instance: serving-cert
    # app.kubernetes.io/managed-by: kustomize
    # app.kubernetes.io/name: certificate
    # app.kubernetes.io/part-of: ironic-standalone-operator
spec:
  dnsNames:
  - {{ include "ironic-standalone-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
  - {{ include "ironic-standalone-operator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "ironic-standalone-operator.fullname" . }}-selfsigned-issuer
  secretName: irso-webhook-server-cert
