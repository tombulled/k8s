apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "ironic-standalone-operator.labels" . | nindent 4 }}
    # app.kubernetes.io/component: rbac
    # app.kubernetes.io/created-by: ironic-standalone-operator
    # app.kubernetes.io/instance: manager-rolebinding
    # app.kubernetes.io/managed-by: kustomize
    # app.kubernetes.io/name: clusterrolebinding
    # app.kubernetes.io/part-of: ironic-standalone-operator
  name: {{ include "ironic-standalone-operator.fullname" . }}-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ironic-standalone-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "ironic-standalone-operator.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
