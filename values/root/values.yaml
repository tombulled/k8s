defaults:
  $metadata:
    clusterId: ""
    clusterType: ""
  namespace: argocd

projectDefaults:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io

projects:
  root:
    sourceRepos:
      - git@github.com:tombulled/k8s.git
      - git@github.com:tombulled/tenant.git
    description: "Root Project"
    destinations:
      - name: in-cluster
      - name: in-cluster
        namespace: argocd
  tenants:
    sourceRepos:
      - git@github.com:tombulled/k8s.git
      - git@github.com:tombulled/tenant.git
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace
    description: "Tenants Project"
    destinations:
      - name: in-cluster
        namespace: "*"

applicationDefaults:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  destination:
    name: in-cluster
  syncPolicy:
    syncOptionsObject:
      serverSideApply: true
  sourcesObject:
    main:
      helm:
        ignoreMissingValueFiles: true

applications:
  root:
    project: root
    sourcesObject:
      main:
        repoURL: git@github.com:tombulled/tenant.git
        targetRevision: main
        path: tenant
        helm:
          valueFiles:
            - $k8s/values/root/values.yaml
            - $k8s/values/root/values-type-{{$metadata.clusterType}}.yaml
            - $k8s/values/root/values-{{$metadata.clusterId}}.yaml
          values: |
            defaults:
              $metadata: {{ $metadata | toJson }}
      k8s:
        repoURL: git@github.com:tombulled/k8s.git
        targetRevision: main
        ref: k8s
    syncPolicy:
      automated:
        enabled: false

xApplicationSets:
  tenants:
    template:
      spec:
        project: tenants
    generatorsObject:
      main:
        x-git:
          repoURL: git@github.com:tombulled/k8s.git
          revision: HEAD
          directories:
            - path: "tenants/*"
          valueFiles:
            - values.yaml
            - values-type-{{$metadata.clusterType}}.yaml
            - values-{{$metadata.clusterId}}.yaml
    defaults:
      $enabled: false
      name: "tenant-{{ `{{$id}}` }}"
      sourcesObject:
        main:
          repoURL: git@github.com:tombulled/tenant.git
          targetRevision: main
          path: tenant
          helm:
            valueFiles:
              - "$k8s/tenants/defaults.yaml"
              - "$k8s/tenants/defaults-type-{{$metadata.clusterType}}.yaml"
              - "$k8s/tenants/defaults-{{$metadata.clusterId}}.yaml"
              - "$k8s/tenants/{{ `{{$id}}` }}/values.yaml"
              - "$k8s/tenants/{{ `{{$id}}` }}/values-type-{{$metadata.clusterType}}.yaml"
              - "$k8s/tenants/{{ `{{$id}}` }}/values-{{$metadata.clusterId}}.yaml"
            valuesObject:
              defaults:
                metadata:
                  tenant: "{{ `{{$id}}` }}"
                  clusterId: "{{$metadata.clusterId}}"
                  clusterType: "{{$metadata.clusterType}}"
        k8s:
          repoURL: git@github.com:tombulled/k8s.git
          targetRevision: main
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
