fullnameOverride: argocd

dex:
  enabled: false

configs:
  secret:
    # Whether to create the argocd-secret
    createSecret: false

  params:
    server.insecure: true
    server.rootpath: "/argo-cd"
    server.basehref: "/argo-cd"

    application.namespaces: "*"
    applicationsetcontroller.namespaces: "*"
    applicationsetcontroller.allowed.scm.providers: git@github.com:tombulled/k8s.git
    applicationsetcontroller.tokenref.strict.mode: "true"

    # ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-Git-File-Globbing/
    applicationsetcontroller.enable.new.git.file.globbing: "true"

  cm:
    url: http://localhost/argo-cd/
    globalProjects: |-
      - labelSelector: {}
        projectName: global

server:
  httproute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: traefik-gateway
        namespace: traefik
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /argo-cd

applicationSet:
  allowAnyNamespace: true

extraObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: argocd-secret
      namespace: argocd
    spec:
      encryptedData:
        admin.password: 
  # Remove all permissions from the `default` project.
  # Reference: https://argo-cd.readthedocs.io/en/stable/user-guide/projects/#the-default-project
  - apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: default
    spec:
      description: "Default Project"
      sourceRepos: []
      sourceNamespaces: []
      destinations: []
      clusterResourceWhitelist: []
      clusterResourceBlacklist:
        - group: '*'
          kind: '*'
      namespaceResourceWhitelist: []
      namespaceResourceBlacklist:
        - group: '*'
          kind: '*'
